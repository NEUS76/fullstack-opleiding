<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullstack Opleiding Les 7 - Contactformulier</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <h1>Welkom bij Fullstack Opleiding Les 7</h1>
    <p>In deze les leren we werken met formulieren.</p>

    <h2>Contactformulier</h2>
    <form action="mailto:mtbouwservice76@gmail.com" method="POST">
        <label for="naam">Naam:</label>
        <input type="text" id="naam" name="naam" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>

        <label for="bericht">Bericht:</label>
        <textarea id="bericht" name="bericht" rows="4" required></textarea>

        <button type="submit">Verstuur</button>
    </form>
</div>
</body>
</html>
